[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Node 20 je v @supabase/supabase-js označený ako zastaraný — ďalšie verzie
  # knižnice ho už nebudú podporovať. Preto beží web na Node 22.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  SECRETS_SCAN_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"
